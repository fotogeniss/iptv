<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRELUDE+ · Live TV · Categories Only</title>
  <style>
    :root {
      --bg: #000;
      --surface: #17161d;
      --surface-2: #211f2c;
      --line: #272630;
      --text: #f8f8fb;
      --muted: #898792;
      --soft: #aaa8b1;
      --accent: #e50914;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0e;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .phone {
      position: relative;
      width: min(100vw, 390px);
      height: min(100vh, 844px);
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 28px 80px rgb(0 0 0 / 55%);
    }

    .content {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 110px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar,
    .rail::-webkit-scrollbar {
      display: none;
    }

    .status {
      height: 34px;
    }

    .header {
      height: 66px;
      display: grid;
      grid-template-columns: 52px 1fr 76px;
      align-items: center;
      padding: 0 16px;
    }

    .back,
    .epg,
    .see-all,
    .category-fab,
    .sheet-close {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .back {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
    }

    .back svg {
      width: 29px;
      height: 29px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header h1 {
      margin: 0;
      text-align: center;
      font-size: 21px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: -.25px;
    }

    .epg {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 10px;
      border: 2px solid #2b2838;
      border-radius: 10px;
      background: #121118;
      font-size: 16px;
      font-weight: 800;
    }

    .epg svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px 20px;
    }

    .search {
      min-width: 0;
      flex: 1;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      border-radius: 16px;
      background: var(--surface);
    }

    .search svg {
      width: 27px;
      height: 27px;
      flex: none;
      stroke: #696773;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
    }

    .search input::placeholder {
      color: #706e78;
    }

    .view-toggle {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .view-toggle[hidden] {
      display: none;
    }

    .view-toggle svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    .view-toggle .list-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .view-toggle[data-view="grid"] .grid-icon,
    .view-toggle[data-view="list"] .list-icon {
      display: none;
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    #sections {
      padding-top: 14px;
    }

    .section {
      padding-bottom: 29px;
    }

    .section-head {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 14px 10px;
    }

    .section-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .see-all {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0 6px 12px;
      background: transparent;
      color: var(--soft);
      font-size: 15px;
    }

    .see-all svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 14px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }

    .card {
      width: 106px;
      flex: 0 0 106px;
      color: #fff;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .poster {
      position: relative;
      width: 106px;
      height: 136px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      background: var(--surface);
    }

    .logo-box {
      width: 72px;
      height: 94px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      background: var(--surface-2);
      color: #383645;
    }

    .logo-box svg {
      width: 45px;
      height: 45px;
      fill: currentColor;
    }

    .favorite {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .card-name {
      min-height: 34px;
      margin-top: 9px;
      overflow: hidden;
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      line-height: 16px;
      text-align: center;
      text-overflow: ellipsis;
    }

    .card-epg {
      min-height: 26px;
      margin-top: 2px;
      overflow: hidden;
      color: var(--soft);
      font-size: 10px;
      font-weight: 600;
      line-height: 13px;
      text-align: center;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    /* Η εναλλαγή αφορά μόνο τα κανάλια μέσα σε επιλεγμένη κατηγορία. */
    .category-view .section-head {
      display: none;
    }

    .category-view .rail.grid-mode {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px 12px;
      overflow: visible;
      padding-top: 2px;
      scroll-snap-type: none;
    }

    .category-view .grid-mode .card,
    .category-view .grid-mode .poster {
      width: 100%;
    }

    .category-view .grid-mode .poster {
      height: auto;
      aspect-ratio: .78;
    }

    .category-view .rail.list-mode {
      display: block;
      overflow: visible;
      padding-top: 2px;
      scroll-snap-type: none;
    }

    .category-view .list-mode .card {
      width: 100%;
      min-height: 94px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      grid-template-rows: auto auto;
      column-gap: 14px;
      align-items: center;
      margin-bottom: 10px;
    }

    .category-view .list-mode .poster {
      width: 72px;
      height: 92px;
      grid-row: 1 / 3;
      border-radius: 10px;
    }

    .category-view .list-mode .logo-box {
      width: 48px;
      height: 62px;
    }

    .category-view .list-mode .logo-box svg {
      width: 32px;
      height: 32px;
    }

    .category-view .list-mode .card-name {
      min-height: 0;
      align-self: end;
      margin: 0 0 3px;
      font-size: 15px;
      line-height: 19px;
      text-align: left;
    }

    .category-view .list-mode .card-epg {
      min-height: 0;
      align-self: start;
      margin: 0;
      font-size: 11px;
      line-height: 15px;
      text-align: left;
    }

    .empty {
      padding: 70px 25px;
      color: var(--muted);
      text-align: center;
    }

    .category-fab {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 48px;
      min-width: 150px;
      height: 52px;
      padding: 0 25px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: var(--accent);
      box-shadow: 0 12px 30px rgb(0 0 0 / 45%);
      color: #fff;
      font-size: 17px;
      font-weight: 850;
    }

    .toast {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 110px;
      max-width: 80%;
      padding: 8px 14px;
      border: 1px solid #33313d;
      border-radius: 999px;
      transform: translate(-50%, -12px);
      background: rgb(24 23 30 / 96%);
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      white-space: nowrap;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .sheet-backdrop {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: end;
      background: rgb(0 0 0 / 62%);
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-height: 72%;
      overflow-y: auto;
      padding: 12px 16px 28px;
      border-radius: 24px 24px 0 0;
      background: #15141b;
    }

    .sheet-handle {
      width: 44px;
      height: 4px;
      margin: 0 auto 18px;
      border-radius: 99px;
      background: #474550;
    }

    .sheet-title {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .sheet-title h2 {
      flex: 1;
      margin: 0;
      font-size: 20px;
    }

    .sheet-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #22212a;
      font-size: 21px;
    }

    .category-row {
      width: 100%;
      display: flex;
      align-items: center;
      padding: 14px 4px;
      border: 0;
      border-bottom: 1px solid #26242e;
      background: transparent;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .category-row span:first-child {
      flex: 1;
      font-size: 15px;
      font-weight: 650;
    }

    .category-row span:last-child {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-height: 650px) {
      .status { height: 18px; }
      .header { height: 58px; }
      .search-wrap { padding-top: 7px; padding-bottom: 13px; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="content" id="content">
      <div class="status"></div>

      <header class="header">
        <button class="back" id="back" aria-label="Επιστροφή στο Home">
          <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg>
        </button>
        <h1 id="screenTitle">Live TV</h1>
        <button class="epg" id="epg">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="13" rx="3"/>
            <path d="m9 3 3 4 3-4M8 11h8M8 15h5"/>
          </svg>
          EPG
        </button>
      </header>

      <div class="search-wrap">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
          <input id="search" type="search" placeholder="Αναζήτηση στα ζωντανά" autocomplete="off">
        </label>
        <button class="view-toggle" id="viewToggle" data-view="list" aria-label="Προβολή ως πλέγμα" title="Εναλλαγή προβολής" hidden>
          <!-- Στο grid δείχνουμε το εικονίδιο λίστας: είναι η επόμενη ενέργεια. -->
          <svg class="list-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M5 8h22M5 16h22M5 24h22"/>
          </svg>
          <svg class="grid-icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="4" width="10" height="10" rx="2"/>
            <rect x="18" y="4" width="10" height="10" rx="2"/>
            <rect x="4" y="18" width="10" height="10" rx="2"/>
            <rect x="18" y="18" width="10" height="10" rx="2"/>
          </svg>
        </button>
      </div>

      <!-- Μόνο κατηγορίες της λίστας. Δεν υπάρχουν «Πρόσφατα» ή «Νέα κανάλια». -->
      <div class="divider"></div>
      <div id="sections"></div>
    </div>

    <button class="category-fab" id="categories">Κατηγορίες</button>
    <div class="toast" id="toast"></div>

    <div class="sheet-backdrop" id="sheetBackdrop">
      <section class="sheet" aria-modal="true" role="dialog">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          <h2>Κατηγορίες</h2>
          <button class="sheet-close" id="sheetClose" aria-label="Κλείσιμο">×</button>
        </div>
        <div id="categoryList"></div>
      </section>
    </div>
  </main>

  <script>
    const groups = [
      {
        name: "DIGEA",
        channels: ["INFO KANAL", "ΕΛΛΗΝΙΚΗ ΒΟΥΛΗ", "ERT WORLD", "MEGA", "ANT1 HD", "SKAI"]
      },
      {
        name: "CINEMA",
        channels: ["NOVA CINEMA 1 SD", "NOVA CINEMA 2 SD", "NOVA CINEMA 3 SD", "NOVA CINEMA 4", "COSMOTE CINEMA 1"]
      },
      {
        name: "CINEMA FILM+",
        channels: ["FILM+ PREMIERE", "FILM+ ACTION", "FILM+ FAMILY", "FILM+ CLASSICS"]
      },
      {
        name: "SPORTS",
        channels: ["COSMOTE SPORT 1", "NOVA SPORTS 1", "COSMOTE SPORT 2", "NOVA SPORTS PRIME"]
      }
    ];

    const sections = document.getElementById("sections");
    const search = document.getElementById("search");
    const toast = document.getElementById("toast");
    const categoryFab = document.getElementById("categories");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const categoryList = document.getElementById("categoryList");
    const screenTitle = document.getElementById("screenTitle");
    const content = document.getElementById("content");
    const viewToggle = document.getElementById("viewToggle");
    let selectedGroup = null;
    let channelView = "list";

    const logoSvg = `
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="17" cy="37" r="5"></circle>
        <circle cx="43" cy="37" r="5"></circle>
        <path d="M27 22c0-2 2-3 4-2l21 13c2 1 2 4 0 5L31 51c-2 1-4 0-4-2V22z"></path>
      </svg>`;

    const epgTitles = [
      "Ειδήσεις τώρα",
      "Ζωντανή σύνδεση",
      "World News",
      "Απογευματινή ενημέρωση"
    ];

    function card(name, index) {
      const epg = epgTitles[index % epgTitles.length];
      return `
        <article class="card" data-name="${name}">
          <div class="poster">
            <div class="logo-box">${logoSvg}</div>
            ${index === 0 ? '<span class="favorite"></span>' : ''}
          </div>
          <div class="card-name">${name}</div>
          <div class="card-epg">Τώρα · ${epg}</div>
        </article>`;
    }

    function render() {
      const term = search.value.trim().toLocaleLowerCase("el");
      const source = selectedGroup
        ? groups.filter(group => group.name === selectedGroup)
        : groups;

      sections.innerHTML = source.map(group => {
        const visible = group.channels.filter(name => name.toLocaleLowerCase("el").includes(term));
        if (!visible.length) return "";
        return `
          <section class="section${selectedGroup ? " category-view" : ""}">
            <div class="section-head">
              <div class="section-title">${group.name}</div>
              <button class="see-all" data-group="${group.name}">
                Όλα
                <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
              </button>
            </div>
            <div class="rail${selectedGroup ? ` ${channelView}-mode` : ""}">${visible.map(card).join("")}</div>
          </section>`;
      }).join("");

      viewToggle.hidden = !selectedGroup;
      viewToggle.dataset.view = channelView;
      viewToggle.setAttribute(
        "aria-label",
        channelView === "grid" ? "Προβολή ως λίστα" : "Προβολή ως πλέγμα"
      );

      if (!sections.innerHTML.trim()) {
        sections.innerHTML = '<div class="empty">Δεν βρέθηκαν ζωντανά κανάλια.</div>';
      }

      document.querySelectorAll(".card").forEach(item => {
        item.addEventListener("click", () => showToast(`Άνοιγμα: ${item.dataset.name}`));
      });

      document.querySelectorAll(".see-all").forEach(button => {
        button.addEventListener("click", () => {
          selectedGroup = button.dataset.group;
          screenTitle.textContent = selectedGroup;
          categoryFab.hidden = true;
          content.scrollTo({ top: 0, behavior: "smooth" });
          render();
        });
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1300);
    }

    function openSheet() {
      sheetBackdrop.classList.add("open");
    }

    function closeSheet() {
      sheetBackdrop.classList.remove("open");
    }

    groups.forEach(group => {
      const row = document.createElement("button");
      row.className = "category-row";
      row.innerHTML = `<span>${group.name}</span><span>${group.channels.length}</span>`;
      row.onclick = () => {
        selectedGroup = group.name;
        screenTitle.textContent = selectedGroup;
        categoryFab.hidden = true;
        closeSheet();
        content.scrollTo({ top: 0, behavior: "smooth" });
        render();
      };
      categoryList.appendChild(row);
    });

    search.addEventListener("input", render);
    viewToggle.addEventListener("click", () => {
      channelView = channelView === "grid" ? "list" : "grid";
      render();
    });
    categoryFab.addEventListener("click", openSheet);
    document.getElementById("sheetClose").addEventListener("click", closeSheet);
    sheetBackdrop.addEventListener("click", event => {
      if (event.target === sheetBackdrop) closeSheet();
    });
    document.getElementById("epg").addEventListener("click", () => showToast("Άνοιγμα πλήρους EPG"));
    document.getElementById("back").addEventListener("click", () => {
      if (selectedGroup) {
        selectedGroup = null;
        screenTitle.textContent = "Live TV";
        categoryFab.hidden = false;
        render();
      } else {
        showToast("Επιστροφή στο Home");
      }
    });

    render();
  </script>
</body>
</html>
