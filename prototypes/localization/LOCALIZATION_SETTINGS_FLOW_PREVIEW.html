<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prelude+ · Localization settings flow</title>
  <style>
    :root{color-scheme:dark;--bg:#070708;--surface:#121215;--raised:#1a1a1f;--line:rgba(255,255,255,.1);--text:#fff;--muted:#aaaab2;--subtle:#73737c;--red:#e50914;--green:#4bc87a;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#231114,transparent 28%),var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.labbar{min-height:64px;display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:rgba(8,8,9,.92);backdrop-filter:blur(18px);z-index:20}.brand{font-size:17px;font-weight:950;letter-spacing:-.04em}.brand b{color:var(--red)}.labbar p{margin:0;color:var(--subtle);font-size:10px}.lab-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.lab-button,.system-select{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);padding:0 12px;font-weight:800;font-size:11px}.lab-button.active{background:#fff;color:#09090a}.system-select{outline:none}.stage{display:grid;place-items:center;padding:28px}.app{position:relative;width:min(1180px,100%);height:min(720px,calc(100vh - 120px));min-height:570px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--bg);box-shadow:0 35px 100px rgba(0,0,0,.55)}.rail{position:absolute;inset:0 auto 0 0;width:248px;padding:26px 17px;background:rgba(14,14,17,.97);border-right:1px solid var(--line)}.logo{display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:950;letter-spacing:.08em}.logo-mark{width:10px;height:28px;background:var(--red);border-radius:3px}.profile{display:flex;align-items:center;gap:10px;margin:25px 0 20px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}.avatar{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,var(--red),#6f0710);font-weight:950}.profile strong,.profile small{display:block}.profile small{margin-top:3px;color:var(--subtle);font-size:9px}.rail-nav{display:grid;gap:6px}.rail-item{height:48px;display:flex;align-items:center;gap:11px;padding:0 12px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font-weight:800;text-align:left}.rail-item.active{background:rgba(255,255,255,.075);border-color:var(--line);color:#fff}.main{height:100%;margin-left:248px;overflow:auto;padding:34px 42px 70px}.eyebrow{color:var(--red);font-size:9px;font-weight:950;letter-spacing:.15em}.title{margin:8px 0 6px;font-size:34px;letter-spacing:-.045em}.intro{max-width:690px;margin:0;color:var(--muted);font-size:12px;line-height:1.55}.section{margin-top:30px}.section h2{margin:0 0 12px;font-size:15px}.settings-card{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--surface)}.setting-row{width:100%;min-height:76px;display:grid;grid-template-columns:44px 1fr auto 18px;align-items:center;gap:13px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left}.setting-row:last-child{border-bottom:0}.setting-row:hover{background:rgba(255,255,255,.035)}.setting-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--raised);color:#fff}.setting-copy strong,.setting-copy span{display:block}.setting-copy strong{font-size:13px}.setting-copy span{margin-top:4px;color:var(--subtle);font-size:9px}.value{color:var(--muted);font-size:10px;font-weight:850}.chevron{color:var(--subtle)}.sample{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.sample-card{min-height:120px;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#17171b,#101012)}.sample-card h3{margin:0 0 8px;font-size:15px}.sample-card p{margin:0;color:var(--muted);font-size:10px;line-height:1.55}.status{display:flex;align-items:center;gap:7px;margin-top:13px;color:var(--muted);font-size:9px}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.overlay{position:absolute;z-index:40;inset:0;display:none;place-items:center;padding:28px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}.overlay.open{display:grid}.dialog{width:min(520px,100%);border:1px solid var(--line);border-radius:21px;background:#151519;box-shadow:0 30px 90px #000;overflow:hidden}.dialog-head{display:flex;align-items:start;gap:14px;padding:22px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:21px}.dialog-head p{margin:6px 0 0;color:var(--muted);font-size:10px;line-height:1.5}.close{margin-left:auto;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--raised);color:#fff}.choices{display:grid;gap:9px;padding:16px}.choice{min-height:70px;display:grid;grid-template-columns:40px 1fr 24px;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:#111114;color:#fff;text-align:left}.choice.selected{border-color:rgba(229,9,20,.65);background:rgba(229,9,20,.08)}.choice-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--raised)}.choice strong,.choice small{display:block}.choice small{margin-top:4px;color:var(--subtle);font-size:9px}.radio{width:19px;height:19px;border:2px solid #666;border-radius:50%}.choice.selected .radio{border:6px solid var(--red)}.dialog-note{padding:0 18px 19px;color:var(--subtle);font-size:9px;line-height:1.5}.focusable:focus-visible,.rail-item:focus-visible,.setting-row:focus-visible,.choice:focus-visible,.close:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .app.mobile{width:390px;height:min(820px,calc(100vh - 112px));min-height:560px;border-radius:30px}.app.mobile .rail{display:none}.app.mobile .main{margin:0;padding:24px 16px 84px}.app.mobile .title{font-size:29px}.app.mobile .sample{grid-template-columns:1fr}.app.mobile .sample-card:last-child{display:none}.app.mobile .overlay{align-items:end;padding:0}.app.mobile .dialog{width:100%;border-radius:24px 24px 0 0}.mobile-nav{display:none}.app.mobile .mobile-nav{position:absolute;z-index:18;inset:auto 12px 10px;display:grid;grid-template-columns:repeat(5,1fr);height:66px;padding:5px;border:1px solid var(--line);border-radius:21px;background:rgba(12,12,14,.96);box-shadow:0 15px 45px #000}.mobile-nav button{border:0;border-radius:16px;background:transparent;color:var(--subtle);font-size:8px;font-weight:800}.mobile-nav button.active{background:#fff;color:var(--red)}
    @media(max-width:760px){.labbar{align-items:flex-start;flex-wrap:wrap}.labbar p{display:none}.lab-actions{width:100%;margin:0}.stage{padding:16px}.system-select{min-width:0;flex:1}}
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol><symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1 0-4h4a5 5 0 0 0 0-10z"/><path d="M7 10h.01M9 6.5h.01M14 6h.01M17 9h.01"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M8 6v14M16 6v14M6 20h4M14 20h4"/></symbol><symbol id="i-access" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M4 8h16M12 6v14M7 12l5 3 5-3M8 21l4-6 4 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </defs></svg>
  <div class="shell">
    <header class="labbar"><div><div class="brand">PRELUDE<b>+</b> Localization</div><p>Functional approval preview · no country flags · immediate app-wide update</p></div><div class="lab-actions"><button class="lab-button active" data-device="tv">TV</button><button class="lab-button" data-device="mobile">Mobile</button><select class="system-select" id="system-language" aria-label="Simulated system language"><option value="el">System: Ελληνικά</option><option value="en">System: English</option></select><button class="lab-button" id="relaunch">Simulate relaunch</button></div></header>
    <main class="stage"><section class="app tv" id="app">
      <aside class="rail"><div class="logo"><span class="logo-mark"></span>PRELUDE+</div><div class="profile"><span class="avatar">K</span><span><strong>Konstantinos</strong><small data-t="primaryProfile"></small></span></div><nav class="rail-nav"><button class="rail-item"><svg class="icon"><use href="#i-home"/></svg><span data-t="sources"></span></button><button class="rail-item"><svg class="icon"><use href="#i-play"/></svg><span data-t="playback"></span></button><button class="rail-item active"><svg class="icon"><use href="#i-palette"/></svg><span data-t="appearance"></span></button><button class="rail-item"><svg class="icon"><use href="#i-info"/></svg><span data-t="about"></span></button></nav></aside>
      <div class="main"><div class="eyebrow" data-t="eyebrow"></div><h1 class="title" data-t="appearanceAccess"></h1><p class="intro" data-t="intro"></p><section class="section"><h2 data-t="display"></h2><div class="settings-card"><button class="setting-row focusable" id="language-row"><span class="setting-icon"><svg class="icon"><use href="#i-globe"/></svg></span><span class="setting-copy"><strong data-t="appLanguage"></strong><span data-t="languageSubtitle"></span></span><span class="value" id="language-value"></span><svg class="icon chevron"><use href="#i-chevron"/></svg></button><button class="setting-row focusable"><span class="setting-icon"><svg class="icon"><use href="#i-text"/></svg></span><span class="setting-copy"><strong data-t="textSize"></strong><span data-t="textSizeSubtitle"></span></span><span class="value">100%</span><svg class="icon chevron"><use href="#i-chevron"/></svg></button><button class="setting-row focusable"><span class="setting-icon"><svg class="icon"><use href="#i-access"/></svg></span><span class="setting-copy"><strong data-t="accessibility"></strong><span data-t="accessibilitySubtitle"></span></span><span class="value" data-t="defaultValue"></span><svg class="icon chevron"><use href="#i-chevron"/></svg></button></div></section><section class="section"><h2 data-t="livePreview"></h2><div class="sample"><article class="sample-card"><h3 data-t="sampleTitle"></h3><p data-t="sampleCopy"></p><div class="status"><span class="status-dot"></span><span id="effective-status"></span></div></article><article class="sample-card"><h3 data-t="fallbackTitle"></h3><p data-t="fallbackCopy"></p><div class="status"><span class="status-dot"></span><span data-t="fallbackStatus"></span></div></article></div></section></div>
      <nav class="mobile-nav"><button class="active" data-t="home"></button><button>Live</button><button data-t="movies"></button><button data-t="series"></button><button data-t="search"></button></nav>
      <div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><span class="setting-icon"><svg class="icon"><use href="#i-globe"/></svg></span><div><h2 data-t="chooseLanguage"></h2><p data-t="chooseLanguageSubtitle"></p></div><button class="close" id="close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="choices"><button class="choice" data-choice="system"><span class="choice-icon"><svg class="icon"><use href="#i-access"/></svg></span><span><strong data-t="automatic"></strong><small id="system-choice-subtitle"></small></span><span class="radio"></span></button><button class="choice" data-choice="el"><span class="choice-icon"><svg class="icon"><use href="#i-globe"/></svg></span><span><strong>Ελληνικά</strong><small>Greek</small></span><span class="radio"></span></button><button class="choice" data-choice="en"><span class="choice-icon"><svg class="icon"><use href="#i-globe"/></svg></span><span><strong>English</strong><small>Αγγλικά</small></span><span class="radio"></span></button></div><div class="dialog-note" data-t="languageNote"></div></div></div>
    </section></main>
  </div>
  <script>
    const strings={el:{primaryProfile:'Κύριο προφίλ',sources:'Πηγές',playback:'Αναπαραγωγή',appearance:'Εμφάνιση',about:'Σχετικά',eyebrow:'ΡΥΘΜΙΣΕΙΣ',appearanceAccess:'Εμφάνιση & προσβασιμότητα',intro:'Η γλώσσα της εφαρμογής είναι ανεξάρτητη από τη γλώσσα ήχου και υποτίτλων. Η αλλαγή εφαρμόζεται σε ολόκληρο το περιβάλλον.',display:'Περιβάλλον εφαρμογής',appLanguage:'Γλώσσα εφαρμογής',languageSubtitle:'Μενού, κουμπιά, μηνύματα και προσβασιμότητα',textSize:'Μέγεθος κειμένου',textSizeSubtitle:'Προσαρμογή ανά συσκευή και απόσταση θέασης',accessibility:'Προσβασιμότητα',accessibilitySubtitle:'Αντίθεση, περιγραφές και μειωμένη κίνηση',defaultValue:'Προεπιλογή',livePreview:'Ζωντανή προεπισκόπηση',sampleTitle:'Η βιβλιοθήκη σου, στη γλώσσα σου',sampleCopy:'Η επιλογή αλλάζει αμέσως τα κείμενα χωρίς να επηρεάζει τίτλους περιεχομένου, ονόματα καναλιών ή δεδομένα παρόχου.',fallbackTitle:'Ασφαλές fallback',fallbackCopy:'Αν λείπει μία ελληνική μετάφραση, εμφανίζεται το αγγλικό κείμενο αντί για κενό, key ή crash.',fallbackStatus:'English fallback διαθέσιμο',home:'Αρχική',movies:'Ταινίες',series:'Σειρές',search:'Αναζήτηση',chooseLanguage:'Γλώσσα εφαρμογής',chooseLanguageSubtitle:'Διάλεξε μία φορά ή άφησε το PRELUDE+ να ακολουθεί τη συσκευή.',automatic:'Αυτόματα (συσκευή)',languageNote:'Η αλλαγή αποθηκεύεται σε αυτή τη συσκευή. Δεν χρησιμοποιούνται σημαίες, επειδή η γλώσσα δεν ταυτίζεται με χώρα.',effective:'Ενεργή γλώσσα: Ελληνικά',systemFollows:'Ακολουθεί τη συσκευή · τώρα Ελληνικά'},en:{primaryProfile:'Primary profile',sources:'Sources',playback:'Playback',appearance:'Appearance',about:'About',eyebrow:'SETTINGS',appearanceAccess:'Appearance & accessibility',intro:'App language is separate from audio and subtitle preferences. Changes apply across the entire interface.',display:'App interface',appLanguage:'App language',languageSubtitle:'Menus, buttons, messages and accessibility',textSize:'Text size',textSizeSubtitle:'Adapted for each device and viewing distance',accessibility:'Accessibility',accessibilitySubtitle:'Contrast, descriptions and reduced motion',defaultValue:'Default',livePreview:'Live preview',sampleTitle:'Your library, in your language',sampleCopy:'The selection updates interface text immediately without changing content titles, channel names or provider data.',fallbackTitle:'Safe fallback',fallbackCopy:'If a Greek translation is missing, English appears instead of an empty label, resource key or crash.',fallbackStatus:'English fallback available',home:'Home',movies:'Movies',series:'Series',search:'Search',chooseLanguage:'App language',chooseLanguageSubtitle:'Choose once or let PRELUDE+ follow this device.',automatic:'Automatic (device)',languageNote:'The choice is stored on this device. Flags are not used because a language is not the same thing as a country.',effective:'Active language: English',systemFollows:'Follows device · currently English'}};
    const app=document.getElementById('app'),overlay=document.getElementById('overlay'),systemSelect=document.getElementById('system-language');let choice='system',systemLanguage='el',effective='el',previousFocus=null,savedChoice='system';
    function render(){effective=choice==='system'?systemLanguage:choice;document.documentElement.lang=effective;const t=strings[effective];document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);document.getElementById('language-value').textContent=choice==='system'?t.automatic:(choice==='el'?'Ελληνικά':'English');document.getElementById('effective-status').textContent=t.effective;document.getElementById('system-choice-subtitle').textContent=t.systemFollows.replace(effective==='el'?'Ελληνικά':'English',systemLanguage==='el'?'Ελληνικά':'English');document.querySelectorAll('[data-choice]').forEach(el=>el.classList.toggle('selected',el.dataset.choice===choice));}
    function openDialog(){previousFocus=document.activeElement;overlay.classList.add('open');setTimeout(()=>document.querySelector(`[data-choice="${choice}"]`).focus(),40)}function closeDialog(){overlay.classList.remove('open');previousFocus?.focus()}
    document.getElementById('language-row').onclick=openDialog;document.getElementById('close').onclick=closeDialog;overlay.onclick=e=>{if(e.target===overlay)closeDialog()};document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{choice=button.dataset.choice;savedChoice=choice;render();closeDialog()});systemSelect.onchange=()=>{systemLanguage=systemSelect.value;render()};document.getElementById('relaunch').onclick=()=>{choice=savedChoice;render();app.animate([{opacity:.45},{opacity:1}],{duration:350,easing:'ease-out'})};document.querySelectorAll('[data-device]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===button));app.className='app '+button.dataset.device;render()});document.addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='Backspace')&&overlay.classList.contains('open')){e.preventDefault();closeDialog();return}if(!app.classList.contains('tv')||!overlay.classList.contains('open')||!['ArrowUp','ArrowDown'].includes(e.key))return;const choices=[...document.querySelectorAll('.choice')],index=choices.indexOf(document.activeElement);if(index<0)return;e.preventDefault();choices[(index+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length].focus()});render();
  </script>
</body>
</html>
