<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRELUDE+ · TV Live Channel Refraction Preview</title>
  <style>
    :root {
      color-scheme:dark;
      --accent:#ef101b;
      --text:#fff;
      --muted:#a9abb4;
      --safe:5.25%;
    }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; }
    body {
      margin:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:#020204;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    button { border:0; color:inherit; font:inherit; }

    .tv {
      position:relative;
      width:min(100vw,177.778vh);
      height:min(100vh,56.25vw);
      min-width:800px;
      min-height:450px;
      overflow:hidden;
      isolation:isolate;
      background:#050609;
    }
    .frame { position:absolute; inset:0; overflow:hidden; background:#090a0d; }
    .outgoing { z-index:1; }
    .incoming { z-index:2; visibility:hidden; }
    .tv.switching .incoming { visibility:visible; }

    .scene {
      position:absolute;
      inset:-2%;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:var(--scene);
      transform:translateZ(0);
    }
    .scene::before {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 73% 24%,rgba(255,255,255,.18),transparent 23%),
        linear-gradient(90deg,rgba(0,0,0,.28),transparent 24%,transparent 76%,rgba(0,0,0,.18)),
        linear-gradient(180deg,rgba(0,0,0,.18),transparent 42%,rgba(0,0,0,.72));
    }
    .scene::after {
      content:"";
      position:absolute;
      inset:10% 12%;
      opacity:.24;
      background:
        linear-gradient(105deg,transparent 0 28%,rgba(255,255,255,.18) 28.2% 28.7%,transparent 29% 67%,rgba(255,255,255,.12) 67.2% 67.7%,transparent 68%),
        linear-gradient(0deg,rgba(0,0,0,.62) 0 9%,transparent 9% 76%,rgba(255,255,255,.1) 76.3% 77%,transparent 77.2%);
      transform:perspective(900px) rotateX(3deg);
    }
    .scene-mark {
      position:relative;
      z-index:1;
      text-align:center;
      filter:drop-shadow(0 18px 32px rgba(0,0,0,.62));
    }
    .scene-mark strong {
      display:block;
      font-size:clamp(44px,5.3vw,92px);
      line-height:.88;
      letter-spacing:-.065em;
    }
    .scene-mark span {
      display:block;
      margin-top:16px;
      font-size:clamp(10px,1vw,18px);
      font-weight:900;
      letter-spacing:.32em;
      opacity:.76;
    }

    /* Same directional idea as the approved mobile prototype, restrained for TV. */
    .tv.next .incoming { animation:reveal-right-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    .tv.prev .incoming { animation:reveal-left-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    .tv.next .outgoing { animation:retreat-left-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    .tv.prev .outgoing { animation:retreat-right-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    @keyframes reveal-right-tv {
      0% { clip-path:polygon(104% 0,100% 0,100% 100%,104% 100%); transform:scale(1.014); filter:blur(2px); }
      46% { clip-path:polygon(49% 0,45% 13%,52% 29%,46% 47%,52% 65%,45% 82%,49% 100%,100% 100%,100% 0); }
      100% { clip-path:polygon(-4% 0,0 13%,0 29%,0 47%,0 65%,0 82%,-4% 100%,100% 100%,100% 0); transform:scale(1); filter:blur(0); }
    }
    @keyframes reveal-left-tv {
      0% { clip-path:polygon(-4% 0,0 0,0 100%,-4% 100%); transform:scale(1.014); filter:blur(2px); }
      46% { clip-path:polygon(51% 0,55% 13%,48% 29%,54% 47%,48% 65%,55% 82%,51% 100%,0 100%,0 0); }
      100% { clip-path:polygon(104% 0,100% 13%,100% 29%,100% 47%,100% 65%,100% 82%,104% 100%,0 100%,0 0); transform:scale(1); filter:blur(0); }
    }
    @keyframes retreat-left-tv { to { transform:translateX(-1.6%) scale(1.008); filter:blur(1.4px) brightness(.72); } }
    @keyframes retreat-right-tv { to { transform:translateX(1.6%) scale(1.008); filter:blur(1.4px) brightness(.72); } }

    .refraction {
      position:absolute;
      z-index:4;
      top:-10%; bottom:-10%;
      width:clamp(72px,7vw,126px);
      opacity:0;
      pointer-events:none;
      background:
        radial-gradient(ellipse at 52% 8%,rgba(255,255,255,.48) 0 2%,transparent 22%),
        radial-gradient(ellipse at 44% 31%,rgba(125,218,255,.31) 0 4%,transparent 28%),
        radial-gradient(ellipse at 57% 60%,rgba(255,255,255,.34) 0 3%,transparent 26%),
        radial-gradient(ellipse at 42% 83%,rgba(114,207,255,.27) 0 3%,transparent 24%);
      filter:blur(11px);
      mix-blend-mode:screen;
    }
    .tv.next .refraction { animation:flow-left-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    .tv.prev .refraction { animation:flow-right-tv 760ms cubic-bezier(.2,.76,.16,1) both; }
    @keyframes flow-left-tv { 0% { left:102%;opacity:0 } 25%,70% { opacity:.46 } 100% { left:-14%;opacity:0 } }
    @keyframes flow-right-tv { 0% { right:102%;opacity:0 } 25%,70% { opacity:.46 } 100% { right:-14%;opacity:0 } }
    .glint {
      position:absolute;
      z-index:3;
      inset:0;
      opacity:0;
      pointer-events:none;
      background:linear-gradient(90deg,transparent 34%,rgba(214,246,255,.07) 50%,transparent 66%);
    }
    .tv.switching .glint { animation:glint-tv 760ms ease both; }
    @keyframes glint-tv { 0%,100% { opacity:0 } 48% { opacity:.55 } }

    .chrome {
      position:absolute;
      z-index:8;
      inset:0;
      pointer-events:none;
      transition:opacity .18s ease;
    }
    .tv.chrome-hidden .chrome { opacity:0; }
    .top-safe {
      position:absolute;
      top:var(--safe); left:var(--safe); right:var(--safe);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand { display:flex; align-items:center; gap:11px; font-size:13px; font-weight:950; letter-spacing:.14em; }
    .brand i { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:16px 0 0 #fff; margin-right:16px; }
    .live { padding:8px 11px; border:1px solid rgba(255,255,255,.2); border-radius:99px; background:rgba(7,7,9,.58); font-size:10px; font-weight:950; letter-spacing:.1em; }

    .bottom-safe {
      position:absolute;
      left:var(--safe); right:var(--safe); bottom:var(--safe);
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:end;
      gap:34px;
      padding-top:100px;
      background:linear-gradient(transparent,rgba(0,0,0,.74));
    }
    .channel-kicker { color:#63d58a; font-size:11px; font-weight:950; letter-spacing:.12em; }
    h1 { margin:8px 0 0; font-size:clamp(26px,2.6vw,46px); line-height:1; letter-spacing:-.035em; }
    .programme { margin-top:9px; color:#d5d6dc; font-size:clamp(12px,1vw,18px); font-weight:720; }
    .meta { display:flex; gap:10px; margin-top:8px; color:var(--muted); font-size:11px; font-weight:750; }
    .quality { padding:2px 6px; border:1px solid rgba(255,255,255,.65); border-radius:4px; color:#fff; font-size:9px; font-weight:950; }
    .remote-hint { align-self:end; color:#999ba4; font-size:10px; font-weight:850; white-space:nowrap; }

    .test-console {
      position:absolute;
      z-index:12;
      top:calc(var(--safe) + 43px);
      right:var(--safe);
      width:min(31vw,380px);
      padding:10px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      background:rgba(7,7,10,.76);
      backdrop-filter:blur(16px);
    }
    .console-label { margin:2px 4px 8px; color:#858791; font-size:9px; font-weight:950; letter-spacing:.11em; }
    .console-row { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .test-button {
      min-height:42px;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:11px;
      background:#202126;
      font-size:11px;
      font-weight:900;
      cursor:pointer;
    }
    .test-button:focus-visible,.test-button.focused {
      outline:0;
      border-color:#fff;
      background:#fff;
      color:#09090b;
      box-shadow:0 0 0 4px rgba(255,255,255,.14);
    }
    .failure { grid-column:1/-1; background:#25191b; color:#ffb8be; }

    .scrubber-demo {
      position:absolute;
      z-index:11;
      left:var(--safe); right:var(--safe);
      bottom:calc(var(--safe) + 112px);
      opacity:0;
      transform:translateY(8px);
      pointer-events:none;
      transition:.18s ease;
    }
    .tv.scrubber-visible .scrubber-demo { opacity:1; transform:none; pointer-events:auto; }
    .scrubber-label { margin-left:62px; color:#aaa; font-size:9px; font-weight:950; letter-spacing:.1em; }
    .scrubber-target {
      width:100%;
      min-height:48px;
      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
      gap:12px;
      margin-top:4px;
      padding:0 10px;
      border:1px solid transparent;
      border-radius:12px;
      background:transparent;
      cursor:pointer;
    }
    .scrubber-target:focus-visible,.scrubber-target.focused {
      outline:0;
      border-color:rgba(255,255,255,.34);
      background:rgba(255,255,255,.10);
      box-shadow:0 0 0 3px rgba(255,255,255,.06);
    }
    .time { color:#ddd; font-size:10px; font-weight:850; }
    .time:last-child { text-align:right; color:#a9abb4; }
    .bar { position:relative; height:2px; border-radius:99px; background:rgba(255,255,255,.28); }
    .played { width:var(--progress,43%); height:100%; border-radius:inherit; background:var(--accent); }
    .thumb { position:absolute; left:var(--progress,43%); top:50%; width:8px; height:8px; transform:translate(-50%,-50%); border-radius:50%; background:#fff; }
    .scrubber-target:focus-visible .bar,.scrubber-target.focused .bar { height:3px; }

    .safe-guide { position:absolute; z-index:20; inset:var(--safe); border:1px dashed rgba(100,221,255,.24); pointer-events:none; opacity:0; }
    .tv.show-safe .safe-guide { opacity:1; }
    .status {
      position:absolute; z-index:20; left:50%; top:var(--safe); transform:translateX(-50%);
      padding:8px 13px; border-radius:99px; opacity:0;
      background:#fff; color:#09090b; font-size:10px; font-weight:950;
      transition:.18s;
    }
    .status.show { opacity:1; }

    @media (prefers-reduced-motion:reduce) {
      .tv.next .incoming,.tv.prev .incoming { animation-duration:1ms; }
      .tv.next .outgoing,.tv.prev .outgoing,.tv .refraction,.tv.switching .glint { animation:none; }
    }
    @media (max-width:1000px),(max-height:600px) {
      .test-console { width:320px; }
      .test-button { min-height:36px; font-size:9px; }
      .bottom-safe { gap:18px; }
      .remote-hint { font-size:8px; }
    }
  </style>
</head>
<body>
  <main class="tv" id="tv" aria-label="Android TV live-channel transition prototype">
    <div class="frame outgoing" id="outgoing"></div>
    <div class="frame incoming" id="incoming"></div>
    <i class="glint"></i>
    <i class="refraction"></i>

    <section class="chrome" aria-live="polite">
      <header class="top-safe">
        <div class="brand"><i></i> PRELUDE+</div>
        <div class="live">● LIVE</div>
      </header>
      <footer class="bottom-safe">
        <div>
          <div class="channel-kicker">ΖΩΝΤΑΝΑ ΤΩΡΑ</div>
          <h1 id="channelName"></h1>
          <div class="programme" id="programme"></div>
          <div class="meta"><span class="quality" id="quality"></span><span id="category"></span><span>•</span><span id="clock">21:42</span></div>
        </div>
        <div class="remote-hint">CH− Προηγούμενο · CH+ Επόμενο · OK Χειριστήρια · BACK Απόκρυψη</div>
      </footer>
    </section>

    <aside class="test-console" aria-label="Χειριστήρια prototype">
      <div class="console-label">PROTOTYPE CONTROLS · ΔΕΝ ΑΝΗΚΟΥΝ ΣΤΟ ΤΕΛΙΚΟ UI</div>
      <div class="console-row">
        <button class="test-button" id="previous">CH− Προηγούμενο</button>
        <button class="test-button" id="next">CH+ Επόμενο</button>
        <button class="test-button" id="scrubberToggle">DPAD scrubber</button>
        <button class="test-button" id="safeToggle">Overscan guide</button>
        <button class="test-button failure" id="failure">Προσομοίωση αποτυχημένου stream</button>
      </div>
    </aside>

    <section class="scrubber-demo" aria-label="DPAD-safe progress bar preview">
      <div class="scrubber-label">VOD SCRUBBER SAFETY PREVIEW · 2 PX LINE / 48 PX FOCUS TARGET</div>
      <button class="scrubber-target" id="scrubber">
        <span class="time" id="elapsed">21:54</span>
        <span class="bar"><i class="played"></i><i class="thumb"></i></span>
        <span class="time">52:18</span>
      </button>
    </section>

    <div class="safe-guide"></div>
    <div class="status" id="status"></div>
  </main>

  <script>
    const channels = [
      {name:'PRELUDE NEWS',programme:'Βραδινό δελτίο ειδήσεων',quality:'FHD',category:'Ενημέρωση',scene:'linear-gradient(125deg,#07111f 0%,#123968 44%,#702036 110%)',mark:'NEWS',sub:'LIVE REPORT'},
      {name:'ARENA SPORT 1',programme:'Champions Night · Live',quality:'4K',category:'Αθλητικά',scene:'linear-gradient(135deg,#061b12 0%,#08763d 44%,#d6a928 120%)',mark:'ARENA',sub:'SPORT 1'},
      {name:'CINEMA PREMIERE',programme:'The Last Horizon',quality:'FHD',category:'Ταινίες',scene:'linear-gradient(120deg,#10091e 0%,#541b58 48%,#d05a36 115%)',mark:'CINEMA',sub:'PREMIERE'},
      {name:'DISCOVERY WORLD',programme:'Blue Planet · Oceans',quality:'HD',category:'Ντοκιμαντέρ',scene:'linear-gradient(145deg,#031b2b 0%,#087a8c 52%,#67cdd4 120%)',mark:'WORLD',sub:'DISCOVERY'}
    ];
    const tv=document.getElementById('tv');
    const outgoing=document.getElementById('outgoing');
    const incoming=document.getElementById('incoming');
    const status=document.getElementById('status');
    const scrubber=document.getElementById('scrubber');
    const channelNameEl=document.getElementById('channelName');
    const programmeEl=document.getElementById('programme');
    const qualityEl=document.getElementById('quality');
    const categoryEl=document.getElementById('category');
    const elapsedEl=document.getElementById('elapsed');
    const previousButton=document.getElementById('previous');
    const nextButton=document.getElementById('next');
    const failureButton=document.getElementById('failure');
    const scrubberToggleButton=document.getElementById('scrubberToggle');
    const safeToggleButton=document.getElementById('safeToggle');
    let index=0;
    let requestedIndex=0;
    let generation=0;
    let commitTimer=0;
    let infoTimer=0;
    let statusTimer=0;
    let progress=43;

    function scene(item){
      return `<div class="scene" style="--scene:${item.scene}"><div class="scene-mark"><strong>${item.mark}</strong><span>${item.sub}</span></div></div>`;
    }
    function paintInfo(item){
      channelNameEl.textContent=item.name;
      programmeEl.textContent=item.programme;
      qualityEl.textContent=item.quality;
      categoryEl.textContent=item.category;
    }
    function showStatus(message){
      status.textContent=message;
      status.classList.add('show');
      clearTimeout(statusTimer);
      statusTimer=setTimeout(()=>status.classList.remove('show'),1350);
    }
    function stopPending(){
      clearTimeout(commitTimer);
      clearTimeout(infoTimer);
      tv.classList.remove('switching','next','prev');
    }
    function step(delta){
      stopPending();
      const request=++generation;
      const targetIndex=(requestedIndex+delta+channels.length)%channels.length;
      const target=channels[targetIndex];
      requestedIndex=targetIndex;
      incoming.innerHTML=scene(target);
      void tv.offsetWidth;
      tv.classList.add('switching',delta>0?'next':'prev');
      infoTimer=setTimeout(()=>{ if(request===generation)paintInfo(target); },320);
      commitTimer=setTimeout(()=>{
        if(request!==generation)return;
        index=targetIndex;
        requestedIndex=index;
        outgoing.innerHTML=scene(target);
        tv.classList.remove('switching','next','prev');
      },780);
    }
    function failStep(){
      stopPending();
      generation++;
      requestedIndex=index;
      paintInfo(channels[index]);
      showStatus('Η ροή απέτυχε · παραμένει το τρέχον κανάλι');
    }
    function toggleScrubber(){
      tv.classList.toggle('scrubber-visible');
      if(tv.classList.contains('scrubber-visible'))setTimeout(()=>scrubber.focus(),40);
      else if(document.activeElement===scrubber)scrubberToggleButton.focus();
    }
    function hideScrubber(){
      tv.classList.remove('scrubber-visible');
      if(document.activeElement===scrubber)scrubberToggleButton.focus();
    }
    function adjustProgress(delta){
      progress=Math.max(0,Math.min(100,progress+delta));
      scrubber.style.setProperty('--progress',`${progress}%`);
      elapsedEl.textContent=`${Math.floor(progress*.52)}:${String(Math.floor(progress*.18)%60).padStart(2,'0')}`;
    }

    previousButton.onclick=()=>step(-1);
    nextButton.onclick=()=>step(1);
    failureButton.onclick=failStep;
    scrubberToggleButton.onclick=toggleScrubber;
    safeToggleButton.onclick=()=>tv.classList.toggle('show-safe');
    scrubber.onkeydown=event=>{
      if(event.key==='ArrowLeft'){adjustProgress(-3);event.preventDefault();}
      if(event.key==='ArrowRight'){adjustProgress(3);event.preventDefault();}
    };
    window.addEventListener('keydown',event=>{
      if(document.activeElement===scrubber&&(event.key==='ArrowLeft'||event.key==='ArrowRight'))return;
      if(event.key==='PageUp'||event.key===']'||event.key.toLowerCase()==='n'){step(1);event.preventDefault();}
      if(event.key==='PageDown'||event.key==='['||event.key.toLowerCase()==='p'){step(-1);event.preventDefault();}
      if(event.key.toLowerCase()==='v'){toggleScrubber();event.preventDefault();}
      if(event.key.toLowerCase()==='o'){tv.classList.toggle('show-safe');event.preventDefault();}
      if(event.key==='Escape'){
        if(tv.classList.contains('scrubber-visible'))hideScrubber();
        else tv.classList.toggle('chrome-hidden');
      }
    });

    outgoing.innerHTML=scene(channels[0]);
    paintInfo(channels[0]);
    previousButton.focus();
  </script>
</body>
</html>
