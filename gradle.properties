# Περισσότερη μνήμη για Gradle/Kotlin: με 2GB το R8 και το Compose compile
# είναι στριμωγμένα. Θέλει PC με 8GB+ RAM.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
# Επαναχρησιμοποίηση αποτελεσμάτων από προηγούμενα builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# true = πακετάρει ΚΑΙ universal + x86_64 APK (αργό, ~215MB). Για διανομή εκτός Play.
prelude.allAbis=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
