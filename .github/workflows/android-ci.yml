name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # This repository does not carry the official Gradle wrapper. An
          # earlier session hand-wrote gradlew and a 6.8KB bootstrap
          # gradle-wrapper.jar because it could not download the real ones; see
          # docs/archive/build/BUILD_STABILIZATION_V1_40_8.md. Wrapper
          # validation, which setup-gradle runs by default, compares that jar
          # against the published Gradle checksums and can never match it, so
          # every run failed within seconds before reaching any project code.
          # Re-enable this the moment the official wrapper is restored with
          # `gradle wrapper --gradle-version 8.9`.
          validate-wrappers: false

      - name: Verify wrapper permissions
        run: chmod +x gradlew

      - name: Static compatibility and architecture contracts
        run: |
          python3 scripts/documentation_contracts.py
          python3 scripts/localization_contracts.py
          python3 scripts/compatibility_contracts.py
          python3 scripts/architecture_audit.py
          python3 scripts/deep_validation_audit.py
          python3 scripts/risk_inventory.py

      - name: Unit tests, lint and APK builds
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace
          --no-daemon
